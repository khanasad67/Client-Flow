<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Follow-ups & Tasks — ClientFlow CRM</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="app-container">
    <div id="sidebar-overlay" class="sidebar-overlay"></div>

    <!-- Sidebar Navigation -->
    <aside class="sidebar">
      <div class="sidebar-brand">
        <div class="brand-icon">CF</div>
        <div class="brand-name">Client<span>Flow</span></div>
      </div>

      <nav class="sidebar-nav">
        <div class="nav-section-title">Menu</div>
        <a href="dashboard.html" class="nav-item" data-page="dashboard">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
          <span>Dashboard</span>
        </a>
        <a href="leads.html" class="nav-item" data-page="leads">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
          <span>Leads</span>
          <span id="sidebar-leads-badge" class="nav-badge">0</span>
        </a>
        <a href="customers.html" class="nav-item" data-page="customers">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
          <span>Customers</span>
        </a>
        <a href="pipeline.html" class="nav-item" data-page="pipeline">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>
          <span>Pipeline</span>
        </a>
        <a href="followups.html" class="nav-item active" data-page="followups">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><polyline points="9 11 12 14 22 4"></polyline><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path></svg>
          <span>Follow-ups</span>
          <span id="sidebar-tasks-badge" class="nav-badge">0</span>
        </a>
        <a href="reports.html" class="nav-item" data-page="reports">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line><line x1="2" y1="20" x2="22" y2="20"></line></svg>
          <span>Reports</span>
        </a>

        <div class="nav-section-title" style="margin-top:1rem;">Tools</div>
        <button type="button" id="btn-reset-data" class="nav-item" style="width:100%; border:none; background:none; text-align:left; cursor:pointer;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><polyline points="1 4 1 10 7 10"></polyline><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path></svg>
          <span>Reset Demo Data</span>
        </button>
      </nav>

      <div class="sidebar-footer">
        <div class="user-profile">
          <div id="sidebar-user-avatar" class="user-avatar">A</div>
          <div class="user-info">
            <div id="sidebar-user-name" class="user-name">Administrator</div>
            <div id="sidebar-user-role" class="user-role">admin@clientflow.com</div>
          </div>
        </div>
        <button type="button" id="btn-logout" class="btn-logout">
          <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
          <span>Sign Out</span>
        </button>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main-wrapper">
      <header class="top-header">
        <div class="header-left">
          <button id="mobile-sidebar-toggle" class="mobile-toggle">
            <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
          </button>
          <h1 class="page-title">Follow-ups & Tasks</h1>
        </div>

        <div class="header-actions">
          <button id="btn-add-task" class="btn btn-primary btn-sm">
            <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            <span>+ Add Follow-up</span>
          </button>
        </div>
      </header>

      <div class="content-body">
        <!-- Filter Tabs -->
        <div style="display:flex; gap:0.5rem; margin-bottom:1.5rem; flex-wrap:wrap;">
          <button class="btn btn-primary btn-sm task-filter-tab" data-tab="all">All Tasks</button>
          <button class="btn btn-secondary btn-sm task-filter-tab" data-tab="pending">Pending</button>
          <button class="btn btn-secondary btn-sm task-filter-tab" data-tab="today">Due Today</button>
          <button class="btn btn-secondary btn-sm task-filter-tab" data-tab="completed">Completed</button>
        </div>

        <!-- Task Items Container -->
        <div id="tasks-list-container">
          <!-- Dynamically populated checklist -->
        </div>

        <!-- Empty State -->
        <div id="tasks-empty-state" class="empty-state" style="display:none;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 11 12 14 22 4"></polyline><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path></svg>
          <p class="empty-state-title">No follow-ups in this view</p>
          <p class="empty-state-text">Everything looks clean and organized. Click "+ Add Follow-up" to schedule work.</p>
        </div>
      </div>
    </main>
  </div>

  <!-- Add/Edit Task Modal -->
  <div id="task-modal-backdrop" class="modal-backdrop">
    <div class="modal-dialog">
      <div class="modal-header">
        <h2 id="task-modal-title" class="modal-title">Add Follow-up Task</h2>
        <button type="button" id="btn-close-task-modal" class="modal-close">&times;</button>
      </div>
      <form id="task-form">
        <div class="modal-body">
          <input type="hidden" id="task-id">

          <div class="form-grid">
            <div class="form-group form-group-full">
              <label for="task-title" class="form-label">Task Title / Action Item <span class="req">*</span></label>
              <input type="text" id="task-title" class="form-control" placeholder="e.g. Call Rahul about the product demo" required>
            </div>

            <div class="form-group form-group-full">
              <label for="task-related" class="form-label">Related Customer or Lead</label>
              <input type="text" id="task-related" list="contacts-datalist" class="form-control" placeholder="Type or select contact name...">
              <datalist id="contacts-datalist"></datalist>
            </div>

            <div class="form-group">
              <label for="task-due-date" class="form-label">Due Date</label>
              <input type="date" id="task-due-date" class="form-control">
            </div>

            <div class="form-group">
              <label for="task-priority" class="form-label">Priority</label>
              <select id="task-priority" class="form-control">
                <option value="High">High</option>
                <option value="Medium" selected>Medium</option>
                <option value="Low">Low</option>
              </select>
            </div>

            <div class="form-group form-group-full">
              <label for="task-desc" class="form-label">Task Description / Agenda</label>
              <textarea id="task-desc" class="form-control" placeholder="Key agenda points, questions to ask, or attachments needed..."></textarea>
            </div>
          </div>
        </div>

        <div class="modal-footer">
          <button type="button" id="btn-cancel-task-modal" class="btn btn-secondary btn-sm">Cancel</button>
          <button type="submit" class="btn btn-primary btn-sm">Save Task</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
  <script src="js/followups.js"></script>
</body>
</html>
