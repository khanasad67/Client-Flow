<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sales Pipeline — ClientFlow CRM</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="app-container">
    <div id="sidebar-overlay" class="sidebar-overlay"></div>

    <!-- Sidebar Navigation -->
    <aside class="sidebar">
      <div class="sidebar-brand">
        <div class="brand-icon">CF</div>
        <div class="brand-name">Client<span>Flow</span></div>
      </div>

      <nav class="sidebar-nav">
        <div class="nav-section-title">Menu</div>
        <a href="dashboard.html" class="nav-item" data-page="dashboard">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
          <span>Dashboard</span>
        </a>
        <a href="leads.html" class="nav-item" data-page="leads">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
          <span>Leads</span>
          <span id="sidebar-leads-badge" class="nav-badge">0</span>
        </a>
        <a href="customers.html" class="nav-item" data-page="customers">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
          <span>Customers</span>
        </a>
        <a href="pipeline.html" class="nav-item active" data-page="pipeline">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>
          <span>Pipeline</span>
        </a>
        <a href="followups.html" class="nav-item" data-page="followups">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><polyline points="9 11 12 14 22 4"></polyline><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path></svg>
          <span>Follow-ups</span>
          <span id="sidebar-tasks-badge" class="nav-badge">0</span>
        </a>
        <a href="reports.html" class="nav-item" data-page="reports">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line><line x1="2" y1="20" x2="22" y2="20"></line></svg>
          <span>Reports</span>
        </a>

        <div class="nav-section-title" style="margin-top:1rem;">Tools</div>
        <button type="button" id="btn-reset-data" class="nav-item" style="width:100%; border:none; background:none; text-align:left; cursor:pointer;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><polyline points="1 4 1 10 7 10"></polyline><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path></svg>
          <span>Reset Demo Data</span>
        </button>
      </nav>

      <div class="sidebar-footer">
        <div class="user-profile">
          <div id="sidebar-user-avatar" class="user-avatar">A</div>
          <div class="user-info">
            <div id="sidebar-user-name" class="user-name">Administrator</div>
            <div id="sidebar-user-role" class="user-role">admin@clientflow.com</div>
          </div>
        </div>
        <button type="button" id="btn-logout" class="btn-logout">
          <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
          <span>Sign Out</span>
        </button>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main-wrapper">
      <header class="top-header">
        <div class="header-left">
          <button id="mobile-sidebar-toggle" class="mobile-toggle">
            <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
          </button>
          <h1 class="page-title">Sales Pipeline</h1>
        </div>

        <div class="header-actions">
          <div style="display:flex; align-items:center; gap:1.25rem; margin-right:1rem; font-size:0.875rem;">
            <div>
              <span style="color:var(--text-muted);">Active Pipeline:</span>
              <strong id="pipeline-total-val" style="color:var(--primary);">$0</strong>
            </div>
            <div>
              <span style="color:var(--text-muted);">Deals:</span>
              <strong id="pipeline-active-deals">0</strong>
            </div>
            <div>
              <span style="color:var(--text-muted);">Win Rate:</span>
              <strong id="pipeline-win-rate" style="color:var(--status-won);">0%</strong>
            </div>
          </div>

          <button id="btn-add-deal" class="btn btn-primary btn-sm">
            <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            <span>+ Add Deal</span>
          </button>
        </div>
      </header>

      <div class="content-body">
        <!-- Kanban Board Container -->
        <div class="pipeline-board">

          <!-- Column 1: New -->
          <div class="pipeline-column" data-stage="New">
            <div class="pipeline-column-header">
              <span class="column-title">
                <span style="width:10px; height:10px; border-radius:50%; background:#3b82f6;"></span>
                New
                <span id="count-new" class="column-count">0</span>
              </span>
              <span id="val-new" class="column-value">$0</span>
            </div>
            <div id="cards-new" class="pipeline-cards-container"></div>
          </div>

          <!-- Column 2: Contacted -->
          <div class="pipeline-column" data-stage="Contacted">
            <div class="pipeline-column-header">
              <span class="column-title">
                <span style="width:10px; height:10px; border-radius:50%; background:#8b5cf6;"></span>
                Contacted
                <span id="count-contacted" class="column-count">0</span>
              </span>
              <span id="val-contacted" class="column-value">$0</span>
            </div>
            <div id="cards-contacted" class="pipeline-cards-container"></div>
          </div>

          <!-- Column 3: Qualified -->
          <div class="pipeline-column" data-stage="Qualified">
            <div class="pipeline-column-header">
              <span class="column-title">
                <span style="width:10px; height:10px; border-radius:50%; background:#f59e0b;"></span>
                Qualified
                <span id="count-qualified" class="column-count">0</span>
              </span>
              <span id="val-qualified" class="column-value">$0</span>
            </div>
            <div id="cards-qualified" class="pipeline-cards-container"></div>
          </div>

          <!-- Column 4: Won -->
          <div class="pipeline-column" data-stage="Won">
            <div class="pipeline-column-header">
              <span class="column-title">
                <span style="width:10px; height:10px; border-radius:50%; background:#10b981;"></span>
                Won
                <span id="count-won" class="column-count">0</span>
              </span>
              <span id="val-won" class="column-value">$0</span>
            </div>
            <div id="cards-won" class="pipeline-cards-container"></div>
          </div>

          <!-- Column 5: Lost -->
          <div class="pipeline-column" data-stage="Lost">
            <div class="pipeline-column-header">
              <span class="column-title">
                <span style="width:10px; height:10px; border-radius:50%; background:#ef4444;"></span>
                Lost
                <span id="count-lost" class="column-count">0</span>
              </span>
              <span id="val-lost" class="column-value">$0</span>
            </div>
            <div id="cards-lost" class="pipeline-cards-container"></div>
          </div>

        </div>
      </div>
    </main>
  </div>

  <!-- Add/Edit Deal Modal -->
  <div id="deal-modal-backdrop" class="modal-backdrop">
    <div class="modal-dialog">
      <div class="modal-header">
        <h2 id="deal-modal-title" class="modal-title">Add New Deal</h2>
        <button type="button" id="btn-close-deal-modal" class="modal-close">&times;</button>
      </div>
      <form id="deal-form">
        <div class="modal-body">
          <input type="hidden" id="deal-id">

          <div class="form-grid">
            <div class="form-group form-group-full">
              <label for="deal-title" class="form-label">Deal Name / Project Title <span class="req">*</span></label>
              <input type="text" id="deal-title" class="form-control" placeholder="e.g. Cloud Infrastructure Migration" required>
            </div>

            <div class="form-group form-group-full">
              <label for="deal-customer-select" class="form-label">Associated Customer / Prospect <span class="req">*</span></label>
              <select id="deal-customer-select" class="form-control" required>
                <!-- Populated dynamically -->
              </select>
            </div>

            <div class="form-group">
              <label for="deal-value" class="form-label">Deal Value ($ USD) <span class="req">*</span></label>
              <input type="number" id="deal-value" class="form-control" placeholder="15000" min="1" step="any" required>
            </div>

            <div class="form-group">
              <label for="deal-stage" class="form-label">Pipeline Stage</label>
              <select id="deal-stage" class="form-control">
                <option value="New">New</option>
                <option value="Contacted">Contacted</option>
                <option value="Qualified">Qualified</option>
                <option value="Won">Won</option>
                <option value="Lost">Lost</option>
              </select>
            </div>

            <div class="form-group">
              <label for="deal-priority" class="form-label">Priority</label>
              <select id="deal-priority" class="form-control">
                <option value="High">High</option>
                <option value="Medium">Medium</option>
                <option value="Low">Low</option>
              </select>
            </div>

            <div class="form-group">
              <label for="deal-closing-date" class="form-label">Expected Closing Date</label>
              <input type="date" id="deal-closing-date" class="form-control">
            </div>
          </div>
        </div>

        <div class="modal-footer">
          <button type="button" id="btn-cancel-deal-modal" class="btn btn-secondary btn-sm">Cancel</button>
          <button type="submit" class="btn btn-primary btn-sm">Save Deal</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
  <script src="js/pipeline.js"></script>
</body>
</html>
